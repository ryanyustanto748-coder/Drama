<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Halaman</title>
    
    <!-- TAG MONETAG VIGNETTE AD (Letakkan Script Vignette Monetag di bawah ini) -->
    <!-- Contoh: <script src="https://quge5.com/88/tag.min.js" data-zone="307240" async data-cfasync="false"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 50px;
            height: 50px;
            background-color: #eef2ff;
            color: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #111827;
        }
        p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-continue {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn-continue:hover {
            background-color: #4338ca;
        }
        .btn-continue:active {
            transform: scale(0.98);
        }
        .footer-note {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">✓</div>
        <h1>Siap Lanjutkan?</h1>
        <p>Klik tombol di bawah ini untuk mengonfirmasi dan melanjutkan ke tujuan Anda.</p>
        
        <!-- MASUKKAN LINK DIRECTLINK MONETAG ANDA PADA HREF -->
        <a href="https://DIRECTLINK_MONETAG_ANDA" class="btn-continue" id="proceedBtn">
            Lanjutkan →
        </a>

        <div class="footer-note">
            Sistem Keamanan Terverifikasi
        </div>
    </div>

</body>
</html>
